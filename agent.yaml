spec_version: "0.1.0"
name: fhir-hl7-message-normalizer
version: 1.0.0
description: Transforms legacy hl7 v2 adt/orm messages into valid hl7 fhir r4 bundle resources for modern electronic health record interoperability.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - hl7-to-fhir-mapping
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - healthcare
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/fhir-hl7-message-normalizer"
